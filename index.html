<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1b2a">
<title>نظام إدارة الأسطول المتكامل | صيانة - فلاتر - تقارير</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-database-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
:root {
  --primary: #0d1b2a;
  --secondary: #1b2838;
  --accent: #e8a020;
  --accent-dark: #c88a18;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --info: #0e7490;
  --light: #f0f4f8;
  --white: #ffffff;
  --gray: #6b7a8d;
  --shadow: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Cairo', 'Segoe UI', -apple-system, sans-serif;
  background: var(--light);
  direction: rtl;
  max-width: 500px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 80px;
}

/* Header */
.header {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  padding: 20px 18px;
  color: white;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: -30px;
  right: -30px;
  width: 150px;
  height: 150px;
  background: rgba(232,160,32,0.08);
  border-radius: 50%;
}
.header-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
.header-sub { font-size: 11px; opacity: 0.7; margin-top: 4px; }
.sync-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--success); margin-left: 6px; }
.sync-dot.offline { background: var(--danger); }

/* Stats */
.stats-row {
  display: flex;
  gap: 10px;
  padding: 14px;
  overflow-x: auto;
  scrollbar-width: none;
}
.stats-row::-webkit-scrollbar { display: none; }
.stat-card {
  background: var(--white);
  border-radius: 20px;
  padding: 12px 16px;
  min-width: 85px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}
.stat-number { font-size: 26px; font-weight: 800; }
.stat-label { font-size: 11px; color: var(--gray); margin-top: 4px; }

/* Sections */
.section { padding: 0 14px; margin-top: 20px; }
.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--gray);
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
}

/* Cards */
.equipment-card {
  background: var(--white);
  border-radius: 18px;
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: all 0.2s;
  border-right: 3px solid var(--accent);
}
.equipment-card:active { transform: scale(0.98); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; }
.card-title { font-size: 15px; font-weight: 700; color: var(--primary); }
.card-code { font-size: 11px; color: var(--gray); }
.badge {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}
.badge-working { background: #d1fae5; color: #065f46; }
.badge-maintenance { background: #fef3c7; color: #78350f; }
.badge-stopped { background: #fee2e2; color: #7f1d1d; }
.progress-bar { height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; margin-top: 8px; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 3px; }

/* Bottom Tab Bar */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 500px;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(0,0,0,0.05);
  display: flex;
  justify-content: space-around;
  padding: 8px 0 20px;
  z-index: 100;
}
.tab-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: none;
  border: none;
  font-family: inherit;
  cursor: pointer;
  font-size: 11px;
  color: var(--gray);
}
.tab-btn.active { color: var(--accent); font-weight: 600; }
.tab-icon { font-size: 22px; }

/* FAB */
.fab {
  position: fixed;
  bottom: 85px;
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 28px;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  border: none;
  color: var(--primary);
  font-size: 26px;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(232,160,32,0.4);
  z-index: 150;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Modals */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 500px;
  height: 100%;
  background: var(--light);
  z-index: 200;
  overflow-y: auto;
  display: none;
}
.modal-overlay.active { display: block; }
.modal-header {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  padding: 50px 20px 24px;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
}
.modal-title { font-size: 20px; font-weight: 800; }
.modal-close {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  width: 36px;
  height: 36px;
  border-radius: 18px;
  font-size: 20px;
  cursor: pointer;
}
.form-group {
  background: var(--white);
  margin: 12px 14px;
  border-radius: 16px;
  overflow: hidden;
}
.form-field { padding: 12px 16px; border-bottom: 1px solid #eef2f6; }
.form-field:last-child { border-bottom: none; }
.form-label { font-size: 11px; color: var(--gray); font-weight: 600; display: block; margin-bottom: 5px; }
.form-input, .form-select {
  width: 100%;
  border: none;
  outline: none;
  font-size: 14px;
  font-family: inherit;
  background: transparent;
  color: var(--primary);
}
.save-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: var(--primary);
  border: none;
  border-radius: 14px;
  padding: 14px;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
  width: calc(100% - 28px);
  margin: 20px 14px;
}
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--primary);
  color: white;
  padding: 10px 20px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 600;
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
.empty-state { text-align: center; padding: 50px 20px; color: var(--gray); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.detail-section {
  background: var(--white);
  border-radius: 18px;
  margin: 12px 14px;
  padding: 16px;
  box-shadow: var(--shadow-sm);
}
.detail-label { font-size: 12px; color: var(--gray); margin-bottom: 4px; }
.detail-value { font-size: 14px; font-weight: 600; color: var(--primary); }
.filter-card {
  background: white;
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 10px;
  border-right: 3px solid var(--success);
}
.filter-card.low { border-right-color: var(--warning); }
.filter-card.critical { border-right-color: var(--danger); }
.qty-btn {
  width: 30px;
  height: 30px;
  border-radius: 15px;
  border: none;
  font-size: 18px;
  cursor: pointer;
}
.order-card {
  background: white;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 10px;
  border-right: 3px solid var(--danger);
}
.order-card.ok { border-right-color: var(--success); }
.big-btn {
  background: linear-gradient(135deg, var(--info), var(--primary));
  border: none;
  color: white;
  padding: 14px;
  border-radius: 16px;
  font-weight: 700;
  width: calc(100% - 28px);
  margin: 0 14px 16px;
  cursor: pointer;
}
.quick-meter-btn {
  background: linear-gradient(135deg, var(--success), #059669);
  border: none;
  color: white;
  padding: 12px;
  border-radius: 16px;
  font-weight: 700;
  margin: 0 14px 16px;
  width: calc(100% - 28px);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- Login Screen -->
<div id="login-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:linear-gradient(135deg, var(--primary), var(--secondary)); z-index:2000; display:flex; align-items:center; justify-content:center; padding:20px;">
  <div style="text-align:center; width:100%; max-width:320px">
    <div style="font-size:60px; margin-bottom:20px">🏗️</div>
    <div style="font-size:28px; font-weight:800; margin-bottom:10px; color:white">نظام الأسطول المتكامل</div>
    <div style="font-size:13px; color:rgba(255,255,255,0.6); margin-bottom:30px">صيانة - فلاتر - تقارير - متابعة</div>
    <input type="text" id="login-username" placeholder="اسم المستخدم" style="width:100%; padding:14px; border-radius:30px; border:none; margin-bottom:12px; text-align:center; font-size:14px">
    <input type="password" id="login-password" placeholder="كلمة المرور" style="width:100%; padding:14px; border-radius:30px; border:none; margin-bottom:20px; text-align:center; font-size:14px">
    <button onclick="performLogin()" style="width:100%; background:var(--accent); color:var(--primary); border:none; padding:14px; border-radius:30px; font-weight:800; font-size:16px; cursor:pointer">دخول</button>
    <div style="margin-top:20px; font-size:11px; color:rgba(255,255,255,0.5)">admin / admin123</div>
  </div>
</div>

<!-- Main App -->
<div id="app-container" style="display:none">
  <div class="header" id="main-header">
    <div class="header-title" id="header-title">📊 لوحة القيادة</div>
    <div class="header-sub" id="header-sub">نظام متابعة الأسطول</div>
  </div>

  <!-- Home View -->
  <div id="view-home">
    <div class="stats-row" id="stats-summary"></div>
    <button class="quick-meter-btn" onclick="openMeterUpdate()">⏱️ تحديث العدادات اليومي لجميع المعدات</button>
    <div class="section">
      <div class="section-title">🚜 جميع المعدات <span id="equipment-count"></span></div>
      <div id="equipment-list-home"></div>
    </div>
  </div>

  <!-- Equipment View -->
  <div id="view-equipment" style="display:none">
    <div style="padding:14px">
      <div class="search-box" style="background:white; border-radius:30px; padding:10px 16px; margin-bottom:12px; display:flex; gap:8px">
        <span>🔍</span>
        <input type="text" id="search-equipment" placeholder="بحث باسم أو كود..." style="flex:1; border:none; outline:none; font-family:inherit; background:transparent">
      </div>
      <div id="equipment-list"></div>
    </div>
  </div>

  <!-- Inventory View -->
  <div id="view-inventory" style="display:none">
    <div id="inv-list" style="padding:14px"></div>
  </div>

  <!-- Orders View -->
  <div id="view-orders" style="display:none">
    <div style="padding:14px">
      <button class="save-btn" style="margin:0 0 12px 0" onclick="generateOrders()">📋 إنشاء طلبية لجميع المعدات</button>
      <div id="orders-list"></div>
    </div>
  </div>

  <!-- Reports View -->
  <div id="view-reports" style="display:none">
    <div style="padding:14px">
      <div class="grid-2" style="margin-bottom:12px">
        <button class="save-btn" style="margin:0; background:var(--success)" onclick="exportToExcel()">📊 Excel</button>
        <button class="save-btn" style="margin:0; background:var(--info)" onclick="exportToCSV()">📁 CSV</button>
      </div>
      <div id="reports-content"></div>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button class="tab-btn" data-view="home" onclick="switchView('home')"><span class="tab-icon">📊</span><span>الرئيسية</span></button>
    <button class="tab-btn" data-view="equipment" onclick="switchView('equipment')"><span class="tab-icon">🏗️</span><span>المعدات</span></button>
    <button class="tab-btn" data-view="inventory" onclick="switchView('inventory')"><span class="tab-icon">📦</span><span>المخزن</span></button>
    <button class="tab-btn" data-view="orders" onclick="switchView('orders')"><span class="tab-icon">📋</span><span>الطلبيات</span></button>
    <button class="tab-btn" data-view="reports" onclick="switchView('reports')"><span class="tab-icon">📊</span><span>التقارير</span></button>
  </div>
  <button class="fab" id="fab-btn" onclick="openAddEquipmentModal()">+</button>
</div>

<!-- Equipment Modal -->
<div class="modal-overlay" id="equipment-modal">
  <div class="modal-header">
    <div class="modal-title" id="modal-title-equipment">إضافة معدة جديدة</div>
    <button class="modal-close" onclick="closeModal('equipment-modal')">✕</button>
  </div>
  <div>
    <div class="form-group">
      <div class="form-field"><label class="form-label">كود المعدة *</label><input class="form-input" id="eq-code" placeholder="مثال: EX-001"></div>
      <div class="form-field"><label class="form-label">اسم المعدة *</label><input class="form-input" id="eq-name" placeholder="مثال: حفارة كاتربيلار 320D"></div>
      <div class="form-field"><label class="form-label">النوع</label><select class="form-select" id="eq-type"><option>حفارة</option><option>لودر</option><option>رافعة</option><option>بلدوزر</option><option>شاحنة</option><option>مولد كهربائي</option></select></div>
      <div class="form-field"><label class="form-label">رقم الشاسيه</label><input class="form-input" id="eq-chassis" placeholder="رقم الهيكل"></div>
      <div class="form-field"><label class="form-label">الموقع</label><input class="form-input" id="eq-location" placeholder="موقع المشروع"></div>
      <div class="form-field"><label class="form-label">⏱️ العداد الحالي (ساعة)</label><input class="form-input" type="number" id="eq-hours" value="0"></div>

      <div class="form-field"><label class="form-label">دورة الصيانة (ساعة)</label><input class="form-input" type="number" id="eq-interval" value="250"></div>
      <div class="form-field"><label class="form-label">الحالة</label><select class="form-select" id="eq-status"><option>يعمل</option><option>صيانة</option><option>متوقف</option></select></div>
      <div class="form-field"><label class="form-label">تاريخ آخر صيانة</label><input class="form-input" type="date" id="eq-last-maintenance"></div>
      <div class="form-field"><label class="form-label">ملاحظات</label><textarea class="form-textarea" id="eq-notes" placeholder="أي ملاحظات"></textarea></div>
    </div>
    <button class="save-btn" onclick="saveEquipment()">✅ حفظ المعدة</button>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal-header">
    <div class="modal-title" id="detail-title">تفاصيل المعدة</div>
    <button class="modal-close" onclick="closeModal('detail-modal')">✕</button>
  </div>
  <div id="detail-content"></div>
  <div class="grid-2" style="margin:12px 14px">
    <button class="save-btn" style="margin:0" onclick="openEditFromDetail()">✏️ تعديل</button>
    <button class="save-btn" style="margin:0; background:var(--danger)" onclick="deleteFromDetail()">🗑️ حذف</button>
  </div>
</div>

<!-- Meter Update Modal -->
<div class="modal-overlay" id="meter-modal">
  <div class="modal-header" style="background:linear-gradient(135deg, #065f46, #0e7490)">
    <div class="modal-title">⏱️ تحديث العدادات اليومي</div>
    <button class="modal-close" onclick="closeModal('meter-modal')">✕</button>
  </div>
  <div id="meter-list" style="padding:14px"></div>
  <div style="position:sticky; bottom:0; background:var(--light); padding:14px">
    <button class="save-btn" onclick="saveAllMeters()">✅ حفظ جميع العدادات</button>
  </div>
</div>

<!-- Firebase Config -->
<script>
// ============================================
// FIREBASE CONFIGURATION
// ============================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD3eWEZZDXCfHtJ6xdD9VwW8hT5vZzV0W4",
  authDomain: "hah-pmv.firebaseapp.com",
  databaseURL: "https://hah-pmv-default-rtdb.firebaseio.com",
  projectId: "hah-pmv"
};

let fbDb = null;
let equipmentData = [];
let inventoryData = [];
let currentUser = null;
let editingEquipmentId = null;
let currentDetailId = null;

// ============================================
// UTILITIES
// ============================================
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

function closeModal(modalId) {
  document.getElementById(modalId).classList.remove('active');
}

function hoursRemaining(eq) {
  return (eq.nextHours || 0) - (eq.hours || 0);
}

function getProgressPercent(eq) {
  return Math.min(100, Math.max(0, (eq.hours / (eq.nextHours || 1)) * 100));
}

function formatNumber(n) {
  return (n || 0).toLocaleString('ar');
}

// ============================================
// FIREBASE INIT
// ============================================
function initFirebase() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.database();
    
    firebase.auth().signInAnonymously().catch(console.error);
    
    fbDb.ref('equipment').on('value', (snap) => {
      const data = snap.val();
      equipmentData = data ? Object.entries(data).map(([id, eq]) => ({ ...eq, id })) : [];
      refreshUI();
    });
    
    fbDb.ref('inventory').on('value', (snap) => {
      const data = snap.val();
      inventoryData = data ? Object.entries(data).map(([id, inv]) => ({ ...inv, id })) : [];
      refreshUI();
    });
  } catch(e) { console.error('Firebase error:', e); }
}

function saveToFirebase(path, data) {
  if (!fbDb) return;
  if (data.id) {
    const { id, ...rest } = data;
    fbDb.ref(`${path}/${id}`).update(rest);
  } else {
    const newId = fbDb.ref(path).push().key;
    fbDb.ref(`${path}/${newId}`).set({ ...data, id: newId });
  }
}

function deleteFromFirebase(path, id) {
  if (!fbDb || !confirm('هل أنت متأكد من الحذف؟')) return;
  fbDb.ref(`${path}/${id}`).remove();
  showToast('تم الحذف بنجاح');
}

// ============================================
// AUTHENTICATION
// ============================================
function performLogin() {
  const username = document.getElementById('login-username').value;
  const password = document.getElementById('login-password').value;
  if (username === 'admin' && password === 'admin123') {
    currentUser = { username: 'admin', role: 'admin', name: 'المدير' };
  } else {
    showToast('بيانات الدخول غير صحيحة');
    return;
  }
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-container').style.display = 'block';
  initFirebase();
}

function logout() {
  currentUser = null;
  document.getElementById('app-container').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

// ============================================
// EQUIPMENT CRUD
// ============================================
function openAddEquipmentModal() {
  editingEquipmentId = null;
  document.getElementById('modal-title-equipment').innerHTML = 'إضافة معدة جديدة';
  ['eq-code', 'eq-name', 'eq-chassis', 'eq-location', 'eq-hours', 'eq-next-hours', 'eq-interval', 'eq-notes'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('eq-type').value = 'حفارة';
  document.getElementById('eq-status').value = 'يعمل';
  document.getElementById('eq-last-maintenance').value = '';
  document.getElementById('equipment-modal').classList.add('active');
}

function openEditFromDetail() {
  if (!currentDetailId) return;
  const eq = equipmentData.find(e => e.id === currentDetailId);
  if (!eq) return;
  editingEquipmentId = eq.id;
  document.getElementById('modal-title-equipment').innerHTML = 'تعديل معدة';
  document.getElementById('eq-code').value = eq.code || '';
  document.getElementById('eq-name').value = eq.name || '';
  document.getElementById('eq-type').value = eq.type || 'حفارة';
  document.getElementById('eq-chassis').value = eq.chassis || '';
  document.getElementById('eq-location').value = eq.location || '';
  document.getElementById('eq-hours').value = eq.hours || 0;
  document.getElementById('eq-next-hours').value = eq.nextHours || 250;
  document.getElementById('eq-interval').value = eq.interval || 250;
  document.getElementById('eq-status').value = eq.status || 'يعمل';

function saveEquipment() {
  const equipment = {
    code: document.getElementById('eq-code').value.trim(),
    name: document.getElementById('eq-name').value.trim(),
    type: document.getElementById('eq-type').value,
    chassis: document.getElementById('eq-chassis').value,
    location: document.getElementById('eq-location').value,
    hours: parseInt(document.getElementById('eq-hours').value) || 0,
    nextHours: parseInt(document.getElementById('eq-next-hours').value) || 250,
    interval: parseInt(document.getElementById('eq-interval').value) || 250,
    status: document.getElementById('eq-status').value,
    lastMaintenance: document.getElementById('eq-last-maintenance').value,
    notes: document.getElementById('eq-notes').value,
    updatedAt: new Date().toISOString()
  };
  
  if (!equipment.code || !equipment.name) {
    showToast('يرجى إدخال الكود والاسم');
    return;
  }
  
  if (editingEquipmentId) {
    const existing = equipmentData.find(e => e.id === editingEquipmentId);
    equipment.filters = existing?.filters || {};
    equipment.maintenanceLogs = existing?.maintenanceLogs || [];
    equipment.hoursLog = existing?.hoursLog || [];
    saveToFirebase('equipment', { ...equipment, id: editingEquipmentId });
    showToast('تم تحديث المعدة');
  } else {
    equipment.createdAt = new Date().toISOString();
    equipment.filters = {};
    equipment.maintenanceLogs = [];
    equipment.hoursLog = [];
    saveToFirebase('equipment', equipment);
    showToast('تم إضافة المعدة');
  }
  closeModal('equipment-modal');
}

function updateSingleMeter(eqId) {
  const input = document.getElementById(`meter-${eqId}`);
  if (!input || !input.value) return;
  const eq = equipmentData.find(e => e.id === eqId);
  if (!eq) return;
  const newHours = parseInt(input.value);
  if (isNaN(newHours) || newHours === eq.hours) return;
  
  const log = { date: new Date().toISOString().split('T')[0], prev: eq.hours, hours: newHours };
  eq.hours = newHours;
  eq.hoursLog = [...(eq.hoursLog || []), log];
  saveToFirebase('equipment', eq);
  showToast(`تم تحديث عداد ${eq.name} إلى ${newHours} ساعة`);
  openMeterUpdate(); // refresh
}

function saveAllMeters() {
  equipmentData.forEach(eq => {
    const input = document.getElementById(`meter-${eq.id}`);
    if (input && input.value) {
      const newHours = parseInt(input.value);
      if (!isNaN(newHours) && newHours !== eq.hours) {
        const log = { date: new Date().toISOString().split('T')[0], prev: eq.hours, hours: newHours };
        eq.hours = newHours;
        eq.hoursLog = [...(eq.hoursLog || []), log];
        saveToFirebase('equipment', eq);
      }
    }
  });
  closeModal('meter-modal');
  showToast('تم تحديث جميع العدادات');
}

function renderInventory() {
  const container = document.getElementById('inv-list');
  if (!inventoryData.length) {
    container.innerHTML = `<div class="empty-state">📦 لا توجد فلاتر في المخزن<br><button class="save-btn" style="margin-top:16px" onclick="openAddInventoryModal()">+ إضافة فلتر جديد</button></div>`;
    return;
  }
  
  container.innerHTML = inventoryData.map(inv => {
    // حساب المعدات المرتبطة
    const linkedEqs = equipmentData.filter(eq => 
      Object.values(eq.filters || {}).some(f => f.invId === inv.id)
    );
    const needed = linkedEqs.length * 4;
    const shortage = Math.max(0, needed - (inv.qty || 0));
    
    return `
      <div class="filter-card ${shortage > 0 ? 'critical' : inv.qty < needed * 1.5 ? 'low' : ''}">
        <div style="display:flex; justify-content:space-between">
          <div><div style="font-weight:700">${inv.type}</div><div style="font-size:11px; color:var(--gray)">P/N: ${inv.partNo}</div></div>
          <div><button class="qty-btn" style="background:var(--accent); width:auto; padding:4px 12px" onclick="openLinkToEquipment('${inv.id}')">🔗 ربط</button></div>
        </div>
        <div class="grid-3" style="margin-top:10px">
          <div><div class="detail-label">المتوفر</div><div class="detail-value">${inv.qty || 0}</div></div>
          <div><div class="detail-label">المطلوب</div><div class="detail-value">${needed}</div></div>
          <div><div class="detail-label">النقص</div><div class="detail-value" style="color:${shortage>0?'var(--danger)':'var(--success)'}">${shortage>0?shortage:'✓'}</div></div>
        </div>
        <div style="margin-top:8px">
          <button onclick="adjustInvQty('${inv.id}', -1)" class="qty-btn" style="background:var(--danger); color:white">-</button>
          <span style="margin:0 10px">${inv.qty || 0}</span>
          <button onclick="adjustInvQty('${inv.id}', 1)" class="qty-btn" style="background:var(--success); color:white">+</button>
        </div>
        ${linkedEqs.length ? `<div style="margin-top:8px; font-size:11px; color:var(--gray); background:#f8fafc; padding:8px; border-radius:12px">
          🔗 مرتبط بـ: ${linkedEqs.map(e => e.name).join(', ')}
        </div>` : '<div style="margin-top:8px; font-size:11px; color:var(--warning)">⚠️ غير مرتبط بأي معدة</div>'}
        <button onclick="deleteFromFirebase('inventory','${inv.id}')" class="save-btn" style="margin:10px 0 0 0; background:#fee2e2; color:var(--danger)">🗑️ حذف</button>
      </div>
    `;
  }).join('');
}

function openAddInventoryModal() {
  const type = prompt('نوع الفلتر:');
  if (!type) return;
  const partNo = prompt('رقم القطعة:');
  if (!partNo) return;
  const qty = parseInt(prompt('الكمية الأولية:', '0')) || 0;
  
  saveToFirebase('inventory', { type, partNo, qty, createdAt: new Date().toISOString() });
  showToast('تم إضافة الفلتر');
}

function adjustInvQty(id, delta) {
  const inv = inventoryData.find(i => i.id === id);
  if (inv) {
    inv.qty = Math.max(0, (inv.qty || 0) + delta);
    saveToFirebase('inventory', inv);
  }
}

function openLinkToEquipment(invId) {
  const inv = inventoryData.find(i => i.id === invId);
  if (!inv) return;
  
  let message = `🔗 ربط فلتر "${inv.type}" بالمعدات\n\nاختر المعدات:\n`;
  equipmentData.forEach((eq, idx) => {
    const isLinked = Object.values(eq.filters || {}).some(f => f.invId === invId);
    message += `${idx + 1}. ${eq.name} (${eq.code}) - ${isLinked ? '✅ مرتبط' : '❌ غير مرتبط'}\n`;
  });
  message += `\nأدخل أرقام المعدات (مفصولة بفواصل) لربطها:`;
  
  const input = prompt(message);
  if (!input) return;
  
  const selectedIndices = input.split(',').map(n => parseInt(n.trim()) - 1).filter(n => !isNaN(n) && n >= 0 && n < equipmentData.length);
  
  equipmentData.forEach((eq, idx) => {
    const isLinked = Object.values(eq.filters || {}).some(f => f.invId === invId);
    const shouldLink = selectedIndices.includes(idx);
    
    if (shouldLink && !isLinked) {
      const filter = { invId, type: inv.type, partNo: inv.partNo, qty: 0, usedPerService: 1 };
      saveToFirebase(`equipment/${eq.id}/filters`, filter);
    } else if (!shouldLink && isLinked) {
      const filterId = Object.entries(eq.filters || {}).find(([, f]) => f.invId === invId)?.[0];
      if (filterId) deleteFromFirebase(`equipment/${eq.id}/filters/${filterId}`, null);
    }
  });
  showToast('تم تحديث الروابط');
}

// ============================================
// ORDERS FUNCTIONS
// ============================================
function generateOrders() {
  let html = '';
  equipmentData.forEach(eq => {
    const items = Object.values(eq.filters || {}).map(f => {
      const needed = (f.usedPerService || 1) * 4;
      const totalQty = f.qty || 0;
      const shortage = Math.max(0, needed - totalQty);
      return { ...f, needed, totalQty, shortage };
    });
    const hasShortage = items.some(i => i.shortage > 0);
    
    if (!hasShortage) {
      html += `<div class="order-card ok"><div class="card-title">${eq.name}</div><div style="font-size:12px">✅ جميع الفلاتر كافية</div></div>`;
    } else {
      html += `<div class="order-card"><div class="card-title">${eq.name} (${eq.code})</div>`;
      items.filter(i => i.shortage > 0).forEach(i => {
        html += `<div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eef2f6">
          <div><div style="font-weight:600">${i.type}</div><div style="font-size:10px">P/N: ${i.partNo}</div></div>
          <div style="color:var(--danger)">يحتاج: ${i.shortage}</div>
        </div>`;
      });
      html += `</div>`;
    }
  });
  document.getElementById('orders-list').innerHTML = html || '<div class="empty-state">لا توجد معدات</div>';
}

function exportToExcel() {
  const data = equipmentData.map(e => ({
    'الكود': e.code,
    'الاسم': e.name,
    'النوع': e.type,
    'الموقع': e.location || '',
    'رقم الشاسيه': e.chassis || '',
    'العداد الحالي': e.hours || 0,
    'الصيانة القادمة': e.nextHours || 0,
    'الحالة': e.status,
    'آخر صيانة': e.lastMaintenance || '',
    'ملاحظات': e.notes || ''
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'المعدات');
  XLSX.writeFile(wb, `تقرير_المعدات_${new Date().toISOString().split('T')[0]}.xlsx`);
  showToast('تم تصدير Excel');
}

function exportToCSV() {
  let csv = "الكود,الاسم,النوع,الموقع,رقم الشاسيه,العداد الحالي,الصيانة القادمة,الحالة,آخر صيانة,ملاحظات\n";
  equipmentData.forEach(e => {
    csv += `"${e.code}","${e.name}","${e.type}","${e.location || ''}","${e.chassis || ''}",${e.hours || 0},${e.nextHours || 0},"${e.status}","${e.lastMaintenance || ''}","${(e.notes || '').replace(/"/g, '""')}"\n`;
  });
  const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `تقرير_المعدات_${new Date().toISOString().split('T')[0]}.csv`;
  link.click();
  showToast('تم تصدير CSV');
}

    reports: '📋 التقارير المتقدمة'
  };
  document.getElementById('header-title').innerHTML = titles[view];
  
  const fab = document.getElementById('fab-btn');
  if (view === 'inventory') fab.onclick = () => openAddInventoryModal();
  else fab.onclick = () => openAddEquipmentModal();
  
  refreshUI();
}
