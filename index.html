<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1b2a">
<title>نظام إدارة الأسطول المتكامل | النسخة الاحترافية</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-database-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-storage-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
:root {
  --primary: #0d1b2a;
  --secondary: #1b2838;
  --accent: #e8a020;
  --accent-dark: #c88a18;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --info: #0e7490;
  --light: #f0f4f8;
  --white: #ffffff;
  --gray: #6b7a8d;
  --shadow: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Cairo', 'Segoe UI', -apple-system, sans-serif;
  background: var(--light);
  direction: rtl;
  max-width: 500px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 80px;
}

/* Header */
.header {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  padding: 20px 18px;
  color: white;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: -30px;
  right: -30px;
  width: 150px;
  height: 150px;
  background: rgba(232,160,32,0.08);
  border-radius: 50%;
}
.header-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
.header-sub { font-size: 11px; opacity: 0.7; margin-top: 4px; }

/* Stats */
.stats-row {
  display: flex;
  gap: 10px;
  padding: 14px;
  overflow-x: auto;
  scrollbar-width: none;
}
.stats-row::-webkit-scrollbar { display: none; }
.stat-card {
  background: var(--white);
  border-radius: 20px;
  padding: 12px 16px;
  min-width: 85px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}
.stat-number { font-size: 26px; font-weight: 800; }
.stat-label { font-size: 11px; color: var(--gray); margin-top: 4px; }

/* Sections */
.section { padding: 0 14px; margin-top: 20px; }
.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--gray);
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
}

/* Cards */
.equipment-card, .driver-card, .fuel-card, .maintenance-card {
  background: var(--white);
  border-radius: 18px;
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: all 0.2s;
}
.equipment-card { border-right: 3px solid var(--accent); }
.driver-card { border-right: 3px solid var(--info); }
.fuel-card { border-right: 3px solid var(--success); }
.maintenance-card { border-right: 3px solid var(--warning); }
.equipment-card:active, .driver-card:active { transform: scale(0.98); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; }
.card-title { font-size: 15px; font-weight: 700; color: var(--primary); }
.card-code { font-size: 11px; color: var(--gray); }
.badge {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}
.badge-working { background: #d1fae5; color: #065f46; }
.badge-maintenance { background: #fef3c7; color: #78350f; }
.badge-stopped { background: #fee2e2; color: #7f1d1d; }
.badge-active { background: #dbeafe; color: #1e40af; }
.progress-bar { height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; margin-top: 8px; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 3px; }

/* Tab Bar */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 500px;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(0,0,0,0.05);
  display: flex;
  justify-content: space-around;
  padding: 8px 0 20px;
  z-index: 100;
  overflow-x: auto;
}
.tab-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: none;
  border: none;
  font-family: inherit;
  cursor: pointer;
  font-size: 10px;
  color: var(--gray);
  min-width: 60px;
}
.tab-btn.active { color: var(--accent); font-weight: 600; }
.tab-icon { font-size: 20px; }

/* FAB */
.fab {
  position: fixed;
  bottom: 85px;
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 28px;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  border: none;
  color: var(--primary);
  font-size: 26px;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(232,160,32,0.4);
  z-index: 150;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Modals */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 500px;
  height: 100%;
  background: var(--light);
  z-index: 200;
  overflow-y: auto;
  display: none;
}
.modal-overlay.active { display: block; }
.modal-header {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  padding: 50px 20px 24px;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
}
.modal-title { font-size: 20px; font-weight: 800; }
.modal-close {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  width: 36px;
  height: 36px;
  border-radius: 18px;
  font-size: 20px;
  cursor: pointer;
}
.form-group {
  background: var(--white);
  margin: 12px 14px;
  border-radius: 16px;
  overflow: hidden;
}
.form-field { padding: 12px 16px; border-bottom: 1px solid #eef2f6; }
.form-field:last-child { border-bottom: none; }
.form-label { font-size: 11px; color: var(--gray); font-weight: 600; display: block; margin-bottom: 5px; }
.form-input, .form-select, .form-textarea {
  width: 100%;
  border: none;
  outline: none;
  font-size: 14px;
  font-family: inherit;
  background: transparent;
  color: var(--primary);
}
.form-textarea { resize: vertical; min-height: 60px; }
.save-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: var(--primary);
  border: none;
  border-radius: 14px;
  padding: 14px;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
  width: calc(100% - 28px);
  margin: 20px 14px;
}
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--primary);
  color: white;
  padding: 10px 20px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 600;
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
.empty-state { text-align: center; padding: 50px 20px; color: var(--gray); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.detail-section {
  background: var(--white);
  border-radius: 18px;
  margin: 12px 14px;
  padding: 16px;
  box-shadow: var(--shadow-sm);
}
.detail-label { font-size: 12px; color: var(--gray); margin-bottom: 4px; }
.detail-value { font-size: 14px; font-weight: 600; color: var(--primary); }
.big-btn {
  background: linear-gradient(135deg, var(--info), var(--primary));
  border: none;
  color: white;
  padding: 14px;
  border-radius: 16px;
  font-weight: 700;
  width: calc(100% - 28px);
  margin: 0 14px 16px;
  cursor: pointer;
}
.image-preview {
  width: 100%;
  max-height: 150px;
  object-fit: cover;
  border-radius: 12px;
  margin-top: 8px;
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- Login Screen -->
<div id="login-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:linear-gradient(135deg, var(--primary), var(--secondary)); z-index:2000; display:flex; align-items:center; justify-content:center; padding:20px;">
  <div style="text-align:center; width:100%; max-width:320px">
    <div style="font-size:60px; margin-bottom:20px">🏗️</div>
    <div style="font-size:28px; font-weight:800; margin-bottom:10px; color:white">نظام الأسطول المتكامل</div>
    <div style="font-size:13px; color:rgba(255,255,255,0.6); margin-bottom:30px">صيانة - سائقين - وقود - تقارير</div>
    <input type="text" id="login-username" placeholder="اسم المستخدم" style="width:100%; padding:14px; border-radius:30px; border:none; margin-bottom:12px; text-align:center; font-size:14px">
    <input type="password" id="login-password" placeholder="كلمة المرور" style="width:100%; padding:14px; border-radius:30px; border:none; margin-bottom:20px; text-align:center; font-size:14px">
    <button onclick="performLogin()" style="width:100%; background:var(--accent); color:var(--primary); border:none; padding:14px; border-radius:30px; font-weight:800; font-size:16px; cursor:pointer">دخول</button>
    <div style="margin-top:20px; font-size:11px; color:rgba(255,255,255,0.5)">admin / admin123</div>
  </div>
</div>

<!-- Main App -->
<div id="app-container" style="display:none">
  <div class="header" id="main-header">
    <div class="header-title" id="header-title">📊 لوحة القيادة</div>
    <div class="header-sub" id="header-sub">نظام متابعة الأسطول</div>
  </div>

  <!-- Home View -->
  <div id="view-home">
    <div class="stats-row" id="stats-summary"></div>
    <button class="big-btn" onclick="openMeterUpdate()">⏱️ تحديث العدادات اليومي</button>
    <div class="section">
      <div class="section-title">🚜 المعدات <span id="equipment-count"></span></div>
      <div id="equipment-list-home"></div>
    </div>
  </div>

  <!-- Equipment View -->
  <div id="view-equipment" style="display:none">
    <div style="padding:14px">
      <div class="search-box" style="background:white; border-radius:30px; padding:10px 16px; margin-bottom:12px; display:flex; gap:8px">
        <span>🔍</span>
        <input type="text" id="search-equipment" placeholder="بحث باسم أو كود..." style="flex:1; border:none; outline:none; font-family:inherit; background:transparent">
      </div>
      <div id="equipment-list"></div>
    </div>
  </div>

  <!-- Drivers View -->
  <div id="view-drivers" style="display:none">
    <div style="padding:14px">
      <div class="search-box" style="background:white; border-radius:30px; padding:10px 16px; margin-bottom:12px; display:flex; gap:8px">
        <span>🔍</span>
        <input type="text" id="search-driver" placeholder="بحث باسم السائق..." style="flex:1; border:none; outline:none; font-family:inherit; background:transparent">
      </div>
      <div id="drivers-list"></div>
    </div>
  </div>

  <!-- Fuel View -->
  <div id="view-fuel" style="display:none">
    <div style="padding:14px">
      <div id="fuel-stats" class="grid-3" style="margin-bottom:16px"></div>
      <div id="fuel-list"></div>
    </div>
  </div>

  <!-- Maintenance View -->
  <div id="view-maintenance" style="display:none">
    <div style="padding:14px">
      <div id="maintenance-list"></div>
    </div>
  </div>

  <!-- Inventory View -->
  <div id="view-inventory" style="display:none">
    <div id="inv-list" style="padding:14px"></div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button class="tab-btn" data-view="home" onclick="switchView('home')"><span class="tab-icon">📊</span><span>الرئيسية</span></button>
    <button class="tab-btn" data-view="equipment" onclick="switchView('equipment')"><span class="tab-icon">🏗️</span><span>المعدات</span></button>
    <button class="tab-btn" data-view="drivers" onclick="switchView('drivers')"><span class="tab-icon">👨‍✈️</span><span>السائقين</span></button>
    <button class="tab-btn" data-view="fuel" onclick="switchView('fuel')"><span class="tab-icon">⛽</span><span>الوقود</span></button>
    <button class="tab-btn" data-view="maintenance" onclick="switchView('maintenance')"><span class="tab-icon">🔧</span><span>الصيانة</span></button>
    <button class="tab-btn" data-view="inventory" onclick="switchView('inventory')"><span class="tab-icon">📦</span><span>المخزن</span></button>
  </div>
  <button class="fab" id="fab-btn" onclick="openAddEquipmentModal()">+</button>
</div>

<!-- Equipment Modal -->
<div class="modal-overlay" id="equipment-modal">
  <div class="modal-header">
    <div class="modal-title" id="modal-title-equipment">إضافة معدة جديدة</div>
    <button class="modal-close" onclick="closeModal('equipment-modal')">✕</button>
  </div>
  <div>
    <div class="form-group">
      <div class="form-field"><label class="form-label">كود المعدة *</label><input class="form-input" id="eq-code" placeholder="مثال: EX-001"></div>
      <div class="form-field"><label class="form-label">اسم المعدة *</label><input class="form-input" id="eq-name" placeholder="مثال: حفارة كاتربيلار 320D"></div>
      <div class="form-field"><label class="form-label">النوع</label><select class="form-select" id="eq-type"><option>حفارة</option><option>لودر</option><option>رافعة</option><option>بلدوزر</option><option>شاحنة</option><option>مولد كهربائي</option></select></div>
      <div class="form-field"><label class="form-label">رقم الشاسيه</label><input class="form-input" id="eq-chassis" placeholder="رقم الهيكل"></div>
      <div class="form-field"><label class="form-label">الموقع</label><input class="form-input" id="eq-location" placeholder="موقع المشروع"></div>
      <div class="form-field"><label class="form-label">السائق المسند</label><select class="form-select" id="eq-driver"></select></div>
      <div class="form-field"><label class="form-label">⏱️ العداد الحالي (ساعة)</label><input class="form-input" type="number" id="eq-hours" value="0"></div>
      <div class="form-field"><label class="form-label">🔧 عداد الصيانة القادمة (ساعة)</label><input class="form-input" type="number" id="eq-next-hours" value="250"></div>
      <div class="form-field"><label class="form-label">دورة الصيانة (ساعة)</label><input class="form-input" type="number" id="eq-interval" value="250"></div>
      <div class="form-field"><label class="form-label">الحالة</label><select class="form-select" id="eq-status"><option>يعمل</option><option>صيانة</option><option>متوقف</option></select></div>
      <div class="form-field"><label class="form-label">رابط صورة المعدة</label><input class="form-input" id="eq-image" placeholder="https://..."></div>
      <div class="form-field"><label class="form-label">ملاحظات</label><textarea class="form-textarea" id="eq-notes" placeholder="أي ملاحظات"></textarea></div>
    </div>
    <button class="save-btn" onclick="saveEquipment()">✅ حفظ المعدة</button>
  </div>
</div>

<!-- Driver Modal -->
<div class="modal-overlay" id="driver-modal">
  <div class="modal-header">
    <div class="modal-title" id="modal-title-driver">إضافة سائق جديد</div>
    <button class="modal-close" onclick="closeModal('driver-modal')">✕</button>
  </div>
  <div>
    <div class="form-group">
      <div class="form-field"><label class="form-label">الاسم الكامل *</label><input class="form-input" id="driver-name" placeholder="مثال: أحمد محمد"></div>
      <div class="form-field"><label class="form-label">رقم الهاتف</label><input class="form-input" id="driver-phone" placeholder="05xxxxxxxx"></div>
      <div class="form-field"><label class="form-label">رقم رخصة القيادة</label><input class="form-input" id="driver-license" placeholder="رقم الرخصة"></div>
      <div class="form-field"><label class="form-label">تاريخ انتهاء الرخصة</label><input class="form-input" type="date" id="driver-license-expiry"></div>
      <div class="form-field"><label class="form-label">الحالة</label><select class="form-select" id="driver-status"><option>نشط</option><option>في إجازة</option><option>منتهي العقد</option></select></div>
      <div class="form-field"><label class="form-label">ملاحظات</label><textarea class="form-textarea" id="driver-notes" placeholder="أي ملاحظات"></textarea></div>
    </div>
    <button class="save-btn" onclick="saveDriver()">✅ حفظ السائق</button>
  </div>
</div>

<!-- Fuel Record Modal -->
<div class="modal-overlay" id="fuel-modal">
  <div class="modal-header" style="background:linear-gradient(135deg, #065f46, #0e7490)">
    <div class="modal-title">⛽ تسجيل تزود بالوقود</div>
    <button class="modal-close" onclick="closeModal('fuel-modal')">✕</button>
  </div>
  <div>
    <div class="form-group">
      <div class="form-field"><label class="form-label">المعدة</label><select class="form-select" id="fuel-equipment"></select></div>
      <div class="form-field"><label class="form-label">الكمية (لتر)</label><input class="form-input" type="number" id="fuel-amount" placeholder="الكمية باللتر"></div>
      <div class="form-field"><label class="form-label">التكلفة (ر.س)</label><input class="form-input" type="number" id="fuel-cost" placeholder="التكلفة"></div>
      <div class="form-field"><label class="form-label">العداد الحالي (ساعة)</label><input class="form-input" type="number" id="fuel-hours" placeholder="قراءة العداد"></div>
      <div class="form-field"><label class="form-label">التاريخ</label><input class="form-input" type="date" id="fuel-date"></div>
      <div class="form-field"><label class="form-label">السائق</label><select class="form-select" id="fuel-driver"></select></div>
      <div class="form-field"><label class="form-label">ملاحظات</label><textarea class="form-textarea" id="fuel-notes" placeholder="أي ملاحظات"></textarea></div>
    </div>
    <button class="save-btn" onclick="saveFuelRecord()">✅ حفظ التزود</button>
  </div>
</div>

<!-- Maintenance Schedule Modal -->
<div class="modal-overlay" id="maintenance-modal">
  <div class="modal-header" style="background:linear-gradient(135deg, var(--warning), var(--accent-dark))">
    <div class="modal-title">🔧 جدولة صيانة دورية</div>
    <button class="modal-close" onclick="closeModal('maintenance-modal')">✕</button>
  </div>
  <div>
    <div class="form-group">
      <div class="form-field"><label class="form-label">المعدة</label><select class="form-select" id="maint-equipment"></select></div>
      <div class="form-field"><label class="form-label">نوع الصيانة</label><select class="form-select" id="maint-type"><option>صيانة دورية</option><option>صيانة طارئة</option><option>فحص دوري</option><option>تغيير زيت</option><option>تغيير فلاتر</option></select></div>
      <div class="form-field"><label class="form-label">التاريخ المحدد</label><input class="form-input" type="date" id="maint-date"></div>
      <div class="form-field"><label class="form-label">العداد المستهدف (ساعة)</label><input class="form-input" type="number" id="maint-hours" placeholder="العداد المستهدف"></div>
      <div class="form-field"><label class="form-label">التكلفة المتوقعة</label><input class="form-input" type="number" id="maint-cost" placeholder="التكلفة"></div>
      <div class="form-field"><label class="form-label">ملاحظات</label><textarea class="form-textarea" id="maint-notes" placeholder"></textarea></div>
    </div>
    <button class="save-btn" onclick="saveMaintenanceSchedule()">✅ جدولة الصيانة</button>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal-header">
    <div class="modal-title" id="detail-title">تفاصيل</div>
    <button class="modal-close" onclick="closeModal('detail-modal')">✕</button>
  </div>
  <div id="detail-content"></div>
</div>

<!-- Meter Update Modal -->
<div class="modal-overlay" id="meter-modal">
  <div class="modal-header" style="background:linear-gradient(135deg, #065f46, #0e7490)">
    <div class="modal-title">⏱️ تحديث العدادات اليومي</div>
    <button class="modal-close" onclick="closeModal('meter-modal')">✕</button>
  </div>
  <div id="meter-list" style="padding:14px"></div>
  <div style="position:sticky; bottom:0; background:var(--light); padding:14px">
    <button class="save-btn" onclick="saveAllMeters()">✅ حفظ جميع العدادات</button>
  </div>
</div>

<!-- Notification Permission -->
<div id="notif-request" style="position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--primary); color:white; padding:12px 20px; border-radius:30px; z-index:300; display:none; gap:12px">
  <span>🔔 تفعيل الإشعارات</span>

<script>
// ============================================
// FIREBASE CONFIGURATION
// ============================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD3eWEZZDXCfHtJ6xdD9VwW8hT5vZzV0W4",
  authDomain: "hah-pmv.firebaseapp.com",
  databaseURL: "https://hah-pmv-default-rtdb.firebaseio.com",
  projectId: "hah-pmv",

};

let fbDb = null;
let fbStorage = null;

// ============================================
// UTILITIES
// ============================================
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

function closeModal(modalId) {
  document.getElementById(modalId).classList.remove('active');
}

function formatNumber(n) {
  return (n || 0).toLocaleString('ar');
}

function hoursRemaining(eq) {
  return (eq.nextHours || 0) - (eq.hours || 0);
}

function getProgressPercent(eq) {
  return Math.min(100, Math.max(0, (eq.hours / (eq.nextHours || 1)) * 100));
}

// ============================================
// NOTIFICATION SYSTEM
// ============================================
function requestNotificationPermission() {
  if ('Notification' in window) {
    Notification.requestPermission().then(perm => {
      if (perm === 'granted') {
        showToast('✅ تم تفعيل الإشعارات');
        document.getElementById('notif-request').style.display = 'none';
        sendNotification('مرحباً', 'سيتم إرسال إشعارات الصيانة والمواعيد');
      }
    });
  }
}

function sendNotification(title, body) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, { body, icon: '🏗️' });
  }
}

function checkMaintenanceAlerts() {
  const today = new Date().toISOString().split('T')[0];
  
  // فحص الصيانة المجدولة
  maintenanceSchedules.forEach(schedule => {
    if (schedule.date === today && !schedule.notified) {
      const eq = equipmentData.find(e => e.id === schedule.equipmentId);
      if (eq) {
        sendNotification(`🔧 صيانة ${eq.name}`, `${schedule.type} - اليوم ${schedule.date}`);
        schedule.notified = true;
        saveToFirebase('maintenanceSchedules', schedule);
      }
    }
  });
  
  // فحص المعدات (متبقي أقل من 50 ساعة)
  equipmentData.forEach(eq => {
    const rem = hoursRemaining(eq);
    if (rem <= 50 && rem > 0 && rem % 10 === 0) {
      const lastNotif = localStorage.getItem(`notif_${eq.id}_${eq.nextHours}`);
      if (!lastNotif) {
        sendNotification(`⚠️ صيانة قريبة - ${eq.name}`, `باقي ${rem} ساعة على الصيانة`);
        localStorage.setItem(`notif_${eq.id}_${eq.nextHours}`, Date.now());
      }
    }
  });
  
  // فحص صلاحية رخص السائقين
  const todayDate = new Date();
  driversData.forEach(driver => {
    if (driver.licenseExpiry) {
      const expiryDate = new Date(driver.licenseExpiry);
      const daysLeft = Math.ceil((expiryDate - todayDate) / (1000 * 60 * 60 * 24));
      if (daysLeft <= 30 && daysLeft > 0 && daysLeft % 10 === 0) {
        const lastNotif = localStorage.getItem(`license_${driver.id}`);
        if (!lastNotif) {
          sendNotification(`📜 رخصة ${driver.name}`, `تنتهي بعد ${daysLeft} يوم`);
          localStorage.setItem(`license_${driver.id}`, Date.now());
        }
      }
    });
  });
}

// ============================================
// FIREBASE INIT
// ============================================
function initFirebase() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.database();
    fbStorage = firebase.storage();
    
    firebase.auth().signInAnonymously().catch(console.error);
    
    fbDb.ref('equipment').on('value', (snap) => {
      const data = snap.val();
      equipmentData = data ? Object.entries(data).map(([id, eq]) => ({ ...eq, id })) : [];
      refreshUI();
    });
    
    fbDb.ref('drivers').on('value', (snap) => {
      const data = snap.val();
      driversData = data ? Object.entries(data).map(([id, d]) => ({ ...d, id })) : [];
      refreshUI();
      updateDriverSelects();
    });
    
    fbDb.ref('fuelRecords').on('value', (snap) => {
      const data = snap.val();
      fuelData = data ? Object.entries(data).map(([id, f]) => ({ ...f, id })) : [];
      refreshUI();
    });
    
    fbDb.ref('maintenanceSchedules').on('value', (snap) => {
      const data = snap.val();
      maintenanceSchedules = data ? Object.entries(data).map(([id, m]) => ({ ...m, id })) : [];
      refreshUI();
    });
    
    fbDb.ref('inventory').on('value', (snap) => {
      const data = snap.val();
      inventoryData = data ? Object.entries(data).map(([id, inv]) => ({ ...inv, id })) : [];
      refreshUI();
    });
    
    // Start notification checker
    if (notificationInterval) clearInterval(notificationInterval);
    notificationInterval = setInterval(checkMaintenanceAlerts, 60000);
    
    // Show notification request after 5 seconds
    setTimeout(() => {
      if (Notification.permission === 'default') {
        document.getElementById('notif-request').style.display = 'flex';
      }
    }, 5000);
    
  } catch(e) { console.error('Firebase error:', e); }
}

function saveToFirebase(path, data) {
  if (!fbDb) return;
  if (data.id) {
    const { id, ...rest } = data;
    fbDb.ref(`${path}/${id}`).update(rest);
  } else {
    const newId = fbDb.ref(path).push().key;
    fbDb.ref(`${path}/${newId}`).set({ ...data, id: newId });
  }
}

function deleteFromFirebase(path, id) {
  if (!fbDb || !confirm('هل أنت متأكد من الحذف؟')) return;
  fbDb.ref(`${path}/${id}`).remove();
  showToast('تم الحذف بنجاح');
}

    driver.createdAt = new Date().toISOString();

  document.getElementById('modal-title-equipment').innerHTML = 'إضافة معدة جديدة';
  ['eq-code', 'eq-name', 'eq-chassis', 'eq-location', 'eq-hours', 'eq-next-hours', 'eq-interval', 'eq-image', 'eq-notes'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('eq-type').value = 'حفارة';
  document.getElementById('eq-status').value = 'يعمل';
  updateDriverSelects();
  document.getElementById('equipment-modal').classList.add('active');
}

function saveEquipment() {
  const equipment = {
    code: document.getElementById('eq-code').value.trim(),
    name: document.getElementById('eq-name').value.trim(),
    type: document.getElementById('eq-type').value,
    chassis: document.getElementById('eq-chassis').value,
    location: document.getElementById('eq-location').value,
    assignedDriver: document.getElementById('eq-driver').value || null,
    hours: parseInt(document.getElementById('eq-hours').value) || 0,
    nextHours: parseInt(document.getElementById('eq-next-hours').value) || 250,
    interval: parseInt(document.getElementById('eq-interval').value) || 250,
    status: document.getElementById('eq-status').value,
    image: document.getElementById('eq-image').value,
    notes: document.getElementById('eq-notes').value,
    updatedAt: new Date().toISOString()
  };
  
  if (!equipment.code || !equipment.name) {
    showToast('يرجى إدخال الكود والاسم');
    return;
  }
  
  if (editingEquipmentId) {
    const existing = equipmentData.find(e => e.id === editingEquipmentId);
    equipment.filters = existing?.filters || {};
    equipment.maintenanceLogs = existing?.maintenanceLogs || [];
    equipment.hoursLog = existing?.hoursLog || [];
    equipment.fuelRecords = existing?.fuelRecords || [];
    saveToFirebase('equipment', { ...equipment, id: editingEquipmentId });
    showToast('تم تحديث المعدة');
  } else {
    equipment.createdAt = new Date().toISOString();
    equipment.filters = {};
    equipment.maintenanceLogs = [];
    equipment.hoursLog = [];
    equipment.fuelRecords = [];
    saveToFirebase('equipment', equipment);
    showToast('تم إضافة المعدة');
  }
  closeModal('equipment-modal');
}

      <div><div class="detail-label">🔧 الصيانة القادمة عند</div><div class="detail-value">${formatNumber(eq.nextHours)} ساعة</div></div>

// METER UPDATE
// ============================================
function openMeterUpdate() {
  const container = document.getElementById('meter-list');
  container.innerHTML = equipmentData.map(eq => `
    <div style="background:white; border-radius:16px; padding:14px; margin-bottom:10px">
      <div style="font-weight:700">${eq.name}</div>
      <div style="font-size:12px; color:var(--gray)">العداد الحالي: ${formatNumber(eq.hours)} ساعة</div>
      <div class="progress-bar"><div class="progress-fill" style="width: ${getProgressPercent(eq)}%"></div></div>
      <div class="grid-2" style="margin-top:10px; gap:8px">
        <input type="number" id="meter-${eq.id}" class="form-input" style="border:1px solid #e2e8f0; border-radius:12px; padding:10px" value="${eq.hours}" placeholder="القراءة الجديدة">
        <button class="save-btn" style="margin:0; padding:10px" onclick="updateSingleMeter('${eq.id}')">تحديث</button>
      </div>
    </div>
  `).join('');
  document.getElementById('meter-modal').classList.add('active');
}

function updateSingleMeter(eqId) {
  const input = document.getElementById(`meter-${eqId}`);
  if (!input || !input.value) return;
  const eq = equipmentData.find(e => e.id === eqId);
  if (!eq) return;
  const newHours = parseInt(input.value);
  if (isNaN(newHours) || newHours === eq.hours) return;
  
  const log = { date: new Date().toISOString().split('T')[0], prev: eq.hours, hours: newHours };
  eq.hours = newHours;
  eq.hoursLog = [...(eq.hoursLog || []), log];
  saveToFirebase('equipment', eq);
  showToast(`تم تحديث عداد ${eq.name} إلى ${newHours} ساعة`);
  openMeterUpdate();
}

function saveAllMeters() {
  equipmentData.forEach(eq => {
    const input = document.getElementById(`meter-${eq.id}`);
    if (input && input.value) {
      const newHours = parseInt(input.value);
      if (!isNaN(newHours) && newHours !== eq.hours) {
        const log = { date: new Date().toISOString().split('T')[0], prev: eq.hours, hours: newHours };
        eq.hours = newHours;
        eq.hoursLog = [...(eq.hoursLog || []), log];
        saveToFirebase('equipment', eq);
      }
    }
  });
  closeModal('meter-modal');
  showToast('تم تحديث جميع العدادات');
  checkMaintenanceAlerts();
}

// ============================================
// INVENTORY FUNCTIONS
// ============================================
function openAddInventoryModal() {
  const type = prompt('نوع الفلتر:');
  if (!type) return;
  const partNo = prompt('رقم القطعة:');
  if (!partNo) return;
  const qty = parseInt(prompt('الكمية الأولية:', '0')) || 0;
  saveToFirebase('inventory', { type, partNo, qty, createdAt: new Date().toISOString() });
  showToast('تم إضافة الفلتر');
}

function adjustInvQty(id, delta) {
  const inv = inventoryData.find(i => i.id === id);
  if (inv) {
    inv.qty = Math.max(0, (inv.qty || 0) + delta);
    saveToFirebase('inventory', inv);
  }
}

function renderInventory() {
  const container = document.getElementById('inv-list');
  if (!inventoryData.length) {
    container.innerHTML = `<div class="empty-state">📦 لا توجد فلاتر في المخزن<br><button class="save-btn" style="margin-top:16px" onclick="openAddInventoryModal()">+ إضافة فلتر جديد</button></div>`;
    return;
  }
  
  container.innerHTML = inventoryData.map(inv => {
    const linkedEqs = equipmentData.filter(eq => 
      Object.values(eq.filters || {}).some(f => f.invId === inv.id)
    );
    const needed = linkedEqs.length * 4;
    const shortage = Math.max(0, needed - (inv.qty || 0));
    
    return `
      <div class="filter-card ${shortage > 0 ? 'critical' : inv.qty < needed * 1.5 ? 'low' : ''}">
        <div><div style="font-weight:700">${inv.type}</div><div style="font-size:11px; color:var(--gray)">P/N: ${inv.partNo}</div></div>
        <div class="grid-3" style="margin-top:10px">
          <div><div class="detail-label">المتوفر</div><div class="detail-value">${inv.qty || 0}</div></div>
          <div><div class="detail-label">المطلوب</div><div class="detail-value">${needed}</div></div>
          <div><div class="detail-label">النقص</div><div class="detail-value" style="color:${shortage>0?'var(--danger)':'var(--success)'}">${shortage>0?shortage:'✓'}</div></div>
        </div>
        <div style="margin-top:8px">
          <button onclick="adjustInvQty('${inv.id}', -1)" class="qty-btn" style="background:var(--danger); color:white; width:30px; height:30px; border-radius:15px; border:none">-</button>
          <span style="margin:0 10px">${inv.qty || 0}</span>
          <button onclick="adjustInvQty('${inv.id}', 1)" class="qty-btn" style="background:var(--success); color:white; width:30px; height:30px; border-radius:15px; border:none">+</button>
        </div>
        <button onclick="deleteFromFirebase('inventory','${inv.id}')" class="save-btn" style="margin:10px 0 0 0; background:#fee2e2; color:var(--danger)">🗑️ حذف</button>
      </div>
    `;
  }).join('');
}

// ============================================
// UI RENDERING
// ============================================
function refreshUI() {
  // Home stats
  const working = equipmentData.filter(e => e.status === 'يعمل').length;
  const maintenance = equipmentData.filter(e => e.status === 'صيانة').length;
  const stopped = equipmentData.filter(e => e.status === 'متوقف').length;
  const activeDrivers = driversData.filter(d => d.status === 'نشط').length;
  const totalFuelCost = fuelData.reduce((sum, f) => sum + (f.cost || 0), 0);
  const pendingMaintenance = maintenanceSchedules.filter(m => m.status === 'مجدول').length;
  
  document.getElementById('stats-summary').innerHTML = `
    <div class="stat-card"><div class="stat-number">${equipmentData.length}</div><div class="stat-label">المعدات</div></div>
    <div class="stat-card"><div class="stat-number" style="color:#10b981">${working}</div><div class="stat-label">يعمل</div></div>
    <div class="stat-card"><div class="stat-number" style="color:#dbeafe">${activeDrivers}</div><div class="stat-label">سائقين</div></div>
    <div class="stat-card"><div class="stat-number" style="color:#f59e0b">${pendingMaintenance}</div><div class="stat-label">صيانة قادمة</div></div>
    <div class="stat-card"><div class="stat-number" style="color:#10b981">${formatNumber(totalFuelCost)}</div><div class="stat-label">تكلفة الوقود</div></div>
  `;
  
  // Equipment list home
  document.getElementById('equipment-count').innerHTML = `(${equipmentData.length})`;
  document.getElementById('equipment-list-home').innerHTML = equipmentData.map(eq => {
    const rem = hoursRemaining(eq);
    const percent = getProgressPercent(eq);
    const remColor = rem <= 50 ? '#ef4444' : rem <= 100 ? '#f59e0b' : '#10b981';
    const driver = driversData.find(d => d.id === eq.assignedDriver);
    return `
      <div class="equipment-card" onclick="openEquipmentDetail('${eq.id}')">
        <div class="card-header">
          <div><div class="card-title">${eq.name}</div><div class="card-code">${eq.code} | ${eq.type}</div></div>
          <span class="badge ${eq.status === 'يعمل' ? 'badge-working' : eq.status === 'صيانة' ? 'badge-maintenance' : 'badge-stopped'}">${eq.status}</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${percent}%; background: ${remColor}"></div></div>
        <div class="grid-2" style="margin-top:8px">
          <div><span class="detail-label">⏱️ ${formatNumber(eq.hours)} ساعة</span></div>
          <div><span class="detail-label" style="color:${remColor}">⏳ ${rem <= 0 ? 'تجاوز' : `${rem} ساعة`}</span></div>
        </div>
        ${driver ? `<div style="margin-top:6px; font-size:11px; color:var(--gray)">👨‍✈️ ${driver.name}</div>` : ''}
        <div class="grid-2" style="margin-top:8px; gap:6px">
          <input type="number" id="home-meter-${eq.id}" class="form-input" style="border:1px solid #e2e8f0; border-radius:12px; padding:8px" placeholder="عداد جديد" value="${eq.hours}">
          <button class="save-btn" style="margin:0; padding:8px; font-size:12px" onclick="event.stopPropagation(); updateSingleMeterFromHome('${eq.id}')">تحديث</button>
        </div>
      </div>
    `;
  }).join('');
  
  // Equipment list
  const search = document.getElementById('search-equipment')?.value || '';
  const filteredEq = equipmentData.filter(e => e.name.includes(search) || e.code.includes(search));
  document.getElementById('equipment-list').innerHTML = filteredEq.map(eq => `
    <div class="equipment-card" onclick="openEquipmentDetail('${eq.id}')">
      <div class="card-header"><div><div class="card-title">${eq.name}</div><div class="card-code">${eq.code}</div></div>
      <span class="badge ${eq.status === 'يعمل' ? 'badge-working' : eq.status === 'صيانة' ? 'badge-maintenance' : 'badge-stopped'}">${eq.status}</span></div>
      <div><span>⏱️ ${formatNumber(eq.hours)} ساعة</span> | <span>🔧 عند ${formatNumber(eq.nextHours)} ساعة</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width: ${getProgressPercent(eq)}%"></div></div>
    </div>`).join('');
  
  // Drivers list
  const driverSearch = document.getElementById('search-driver')?.value || '';
  const filteredDrivers = driversData.filter(d => d.name.includes(driverSearch));
  document.getElementById('drivers-list').innerHTML = filteredDrivers.map(d => {
    const assignedEqs = equipmentData.filter(eq => eq.assignedDriver === d.id);
    const licenseExpired = d.licenseExpiry && new Date(d.licenseExpiry) < new Date();
    return `
      <div class="driver-card" onclick="openDriverDetail('${d.id}')">
        <div class="card-header">
          <div><div class="card-title">👨‍✈️ ${d.name}</div><div class="card-code">${d.phone || 'لا يوجد هاتف'}</div></div>
          <span class="badge ${d.status === 'نشط' ? 'badge-active' : 'badge-stopped'}">${d.status}</span>
        </div>
        <div class="grid-2" style="margin-top:8px">
          <div><span class="detail-label">🚜 معدة</span><br><span class="detail-value">${assignedEqs.map(e => e.name).join(', ') || '—'}</span></div>
          <div><span class="detail-label">📜 الرخصة</span><br><span class="detail-value" style="color:${licenseExpired ? 'var(--danger)' : 'var(--success)'}">${d.licenseExpiry || '—'}</span></div>
        </div>
      </div>
    `;
  }).join('');
  
  // Fuel list
  const totalFuelAmount = fuelData.reduce((sum, f) => sum + (f.amount || 0), 0);
  const avgFuelCost = fuelData.length ? totalFuelCost / fuelData.length : 0;
  document.getElementById('fuel-stats').innerHTML = `
    <div class="stat-card"><div class="stat-number">${formatNumber(totalFuelAmount)}</div><div class="stat-label">إجمالي اللترات</div></div>
    <div class="stat-card"><div class="stat-number">${formatNumber(totalFuelCost)}</div><div class="stat-label">التكلفة الإجمالية</div></div>
    <div class="stat-card"><div class="stat-number">${formatNumber(Math.round(avgFuelCost))}</div><div class="stat-label">متوسط التكلفة</div></div>
  `;
  
  document.getElementById('fuel-list').innerHTML = fuelData.slice(-20).reverse().map(f => {
    const eq = equipmentData.find(e => e.id === f.equipmentId);
    const driver = driversData.find(d => d.id === f.driverId);
    return `
      <div class="fuel-card">
        <div class="card-header">
          <div><div class="card-title">⛽ ${eq?.name || 'معدة غير معروفة'}</div><div class="card-code">${f.date}</div></div>
          <span class="badge badge-working">${f.amount} لتر</span>
        </div>
        <div class="grid-2" style="margin-top:8px">
          <div><span class="detail-label">التكلفة</span><div class="detail-value">${f.cost || 0} ر.س</div></div>
          <div><span class="detail-label">العداد</span><div class="detail-value">${f.hours || 0} ساعة</div></div>
          <div><span class="detail-label">السائق</span><div class="detail-value">${driver?.name || '—'}</div></div>
        </div>
      </div>
    `;
  }).join('');
  
  // Maintenance list
  document.getElementById('maintenance-list').innerHTML = maintenanceSchedules.filter(m => m.status === 'مجدول').map(m => {
    const eq = equipmentData.find(e => e.id === m.equipmentId);
    const isToday = m.date === new Date().toISOString().split('T')[0];
    return `
      <div class="maintenance-card" onclick="showMaintenanceDetail('${m.id}')">
        <div class="card-header">
          <div><div class="card-title">🔧 ${m.type}</div><div class="card-code">${eq?.name || 'معدة غير معروفة'}</div></div>
          <span class="badge ${isToday ? 'badge-maintenance' : 'badge-active'}">${isToday ? 'اليوم' : m.date}</span>
        </div>
        <div class="grid-2" style="margin-top:8px">
          <div><span class="detail-label">العداد المستهدف</span><div class="detail-value">${m.targetHours || '—'} ساعة</div></div>
          <div><span class="detail-label">التكلفة المتوقعة</span><div class="detail-value">${m.estimatedCost || 0} ر.س</div></div>
        </div>
      </div>
    `;
  }).join('');
  
  if (maintenanceSchedules.filter(m => m.status === 'مجدول').length === 0) {
    document.getElementById('maintenance-list').innerHTML = '<div class="empty-state">لا توجد صيانات مجدولة</div>';
  }
  
  renderInventory();
}

function updateSingleMeterFromHome(eqId) {
  const input = document.getElementById(`home-meter-${eqId}`);
  if (!input || !input.value) return;
  const eq = equipmentData.find(e => e.id === eqId);
  if (!eq) return;
  const newHours = parseInt(input.value);
  if (isNaN(newHours) || newHours === eq.hours) return;
  
  const log = { date: new Date().toISOString().split('T')[0], prev: eq.hours, hours: newHours };
  eq.hours = newHours;
  eq.hoursLog = [...(eq.hoursLog || []), log];
  saveToFirebase('equipment', eq);
  showToast(`تم تحديث عداد ${eq.name} إلى ${newHours} ساعة`);
  refreshUI();
}

function showMaintenanceDetail(id) {
  const m = maintenanceSchedules.find(m => m.id === id);
  if (!m) return;
  const eq = equipmentData.find(e => e.id === m.equipmentId);
  currentDetailId = id;
  currentDetailType = 'maintenance';
  document.getElementById('detail-title').innerHTML = `🔧 تفاصيل الصيانة`;
  document.getElementById('detail-content').innerHTML = `
    <div class="detail-section">
      <div class="grid-2">
        <div><div class="detail-label">المعدة</div><div class="detail-value">${eq?.name || '—'}</div></div>
        <div><div class="detail-label">نوع الصيانة</div><div class="detail-value">${m.type}</div></div>
        <div><div class="detail-label">التاريخ</div><div class="detail-value">${m.date}</div></div>
        <div><div class="detail-label">العداد المستهدف</div><div class="detail-value">${m.targetHours || '—'} ساعة</div></div>
        <div><div class="detail-label">التكلفة المتوقعة</div><div class="detail-value">${m.estimatedCost || 0} ر.س</div></div>
        <div><div class="detail-label">الحالة</div><div class="detail-value">${m.status}</div></div>
      </div>
    </div>
    ${m.notes ? `<div class="detail-section"><div class="detail-label">ملاحظات</div><div class="detail-value">${m.notes}</div></div>` : ''}
    <div class="grid-2" style="margin:12px 14px">
      <button class="save-btn" style="margin:0; background:var(--success)" onclick="completeMaintenance('${m.id}')">✅ إكمال الصيانة</button>
      <button class="save-btn" style="margin:0; background:var(--danger)" onclick="deleteFromFirebase('maintenanceSchedules','${m.id}')">🗑️ حذف</button>
    </div>
  `;
  document.getElementById('detail-modal').classList.add('active');
}

function completeMaintenance(id) {
  const m = maintenanceSchedules.find(m => m.id === id);
  if (!m) return;
  m.status = 'مكتمل';
  m.completedAt = new Date().toISOString();
  saveToFirebase('maintenanceSchedules', m);
  closeModal('detail-modal');
  showToast('تم إكمال الصيانة');
  refreshUI();
}

// ============================================
// VIEW SWITCHING
// ============================================
function switchView(view) {
  document.getElementById('view-home').style.display = view === 'home' ? 'block' : 'none';
  document.getElementById('view-equipment').style.display = view === 'equipment' ? 'block' : 'none';
  document.getElementById('view-drivers').style.display = view === 'drivers' ? 'block' : 'none';
  document.getElementById('view-fuel').style.display = view === 'fuel' ? 'block' : 'none';
  document.getElementById('view-maintenance').style.display = view === 'maintenance' ? 'block' : 'none';
  document.getElementById('view-inventory').style.display = view === 'inventory' ? 'block' : 'none';
  
  document.querySelectorAll('.tab-btn').forEach(btn => {
    if (btn.dataset.view === view) btn.classList.add('active');
    else btn.classList.remove('active');
  });
  
  const titles = {
    home: '📊 لوحة القيادة',
    equipment: '🏗️ إدارة المعدات',
    drivers: '👨‍✈️ إدارة السائقين',
    fuel: '⛽ تتبع الوقود',
    maintenance: '🔧 الصيانة الدورية',
    inventory: '📦 المخزن المركزي'
  };
  document.getElementById('header-title').innerHTML = titles[view];
  
  const fab = document.getElementById('fab-btn');
  if (view === 'equipment') fab.onclick = () => openAddEquipmentModal();
  else if (view === 'drivers') fab.onclick = () => openAddDriverModal();
  else if (view === 'fuel') fab.onclick = () => openAddFuelModal();
  else if (view === 'maintenance') fab.onclick = () => openAddMaintenanceModal();
  else if (view === 'inventory') fab.onclick = () => openAddInventoryModal();
  else fab.onclick = () => openAddEquipmentModal();
  
  refreshUI();
}
